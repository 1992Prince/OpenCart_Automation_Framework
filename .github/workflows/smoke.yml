name: smoke Tests

on:
  # We can also trigger this workflow on schedule, push to main,
  # or pull requests. Keeping them commented for now.

  # schedule:
  #   - cron: '30 14 * * 1-5'   # Mon-Fri 8:00 PM IST

  # push:
  #   branches: [main]

  # pull_request:
  #   branches: [main]

  # Manually trigger workflow from Actions tab.
  # Because environment is required and type is choice,
  # GitHub will show a dropdown.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - stage
          - dev


jobs:

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Select GitHub Environment based on dropdown value.
    # QA -> QA secrets
    # stage -> stage secrets
    # dev -> dev secrets
    environment: ${{ inputs.environment }}

    steps:

      # ----------------------------------------
      # 1. Checkout
      # Clone repository into the CI machine.
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Node.js
      # Install the required Node.js version.
      # npm cache is also enabled.
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm


      # ----------------------------------------
      # 3. Cache Playwright browsers
      # Reuse downloaded browser binaries in future runs.
      # Cache key changes when package-lock.json changes.
      # ----------------------------------------
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-


      # ----------------------------------------
      # 4. Install dependencies
      # npm ci installs dependencies from package-lock.json.
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci


      # ----------------------------------------
      # 5. Install Playwright browser
      # If browser is already cached, installation is skipped.
      # ----------------------------------------
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium


      # ----------------------------------------
      # 6. Install OS dependencies
      # CI machines are fresh, so OS dependencies are
      # installed even when browser binaries are cached.
      # ----------------------------------------
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium


      # ----------------------------------------
      # 7. Run Playwright tests
      # ENV is a normal environment variable.
      # Its value comes from the selected dropdown.
      #
      # secrets.* comes from the selected GitHub Environment.
      # ----------------------------------------
      - name: Run Playwright tests
        run: npm run test:smoke
        env:

          # Normal environment variable used by Playwright config.
          # Example: QA -> ENV=QA
          ENV: ${{ inputs.environment }}

          # These secrets are automatically taken from
          # the selected GitHub Environment.
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          GRANT_TYPE: ${{ secrets.GRANT_TYPE }}


      # ----------------------------------------
      # 8. Upload HTML report
      # Always upload, even when tests fail.
      # ----------------------------------------
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7


      # ----------------------------------------
      # 9. Upload test results / debugging artifacts
      # Contains screenshots, videos, traces, etc.
      # Always upload, even when tests fail.
      # ----------------------------------------
      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7


  # ==========================================================
  # PIPELINE SUMMARY
  # ==========================================================

  summary:
    name: Pipeline Summary
    needs: [test]

    # Summary should run even if test job fails.
    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Results
        run: |
          echo "═══════════════════════════════════════════"
          echo "       PLAYWRIGHT PIPELINE SUMMARY"
          echo "═══════════════════════════════════════════"

          echo "Environment:    ${{ inputs.environment }}"
          echo "Test Job:       ${{ needs.test.result }}"
          echo "Workflow:       ${{ github.workflow }}"
          echo "Run Number:     ${{ github.run_number }}"
          echo "Run ID:         ${{ github.run_id }}"
          echo "Branch:         ${{ github.ref_name }}"
          echo "Commit:         ${{ github.sha }}"
          echo "Triggered By:   ${{ github.actor }}"

          echo "───────────────────────────────────────────"

          echo "HTML Report:    Uploaded as CI artifact"
          echo "Test Results:   Uploaded as CI artifact"

          echo "═══════════════════════════════════════════"